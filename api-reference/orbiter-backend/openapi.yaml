    VerifyEmailRequest:
      type: object
      required:
        - code
        - pending_authentication_token
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 12
        pending_authentication_token:
          type: string
    SendVerificationEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
        - confirm_password
      properties:
        token:
          type: string
          description: The ?token= value from the reset email link.
        new_password:
          type: string
          minLength: 8
          maxLength: 128
        confirm_password:
          type: string
          description: Must match new_password.
