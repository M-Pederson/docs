        master_company_id:
          type:
            - string
            - 'null'
          format: uuid
          description: The Universe entity UUID (canonical id).
        node_uuid:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            Graph node uuid; populated on creates unless the graph was unavailable (backfilled later).
        company_name:
          type:
            - string
            - 'null'
        company_domain:
          type:
            - string
            - 'null'
        permalink:
          type:
            - string
            - 'null'
          description: Reserved; always null today.
        linkedin_url:
          type:
            - string
            - 'null'
      required:
