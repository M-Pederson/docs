        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags:
        - Collections
      summary: Comment on a collection
      description: |
        Adds a comment to a collection, authored by the authenticated user. The authenticated user must
        have access to the collection.
      operationId: createCollectionComment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionCommentRequest'
      responses:
        '201':
          description: The created comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionCommentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /collection-comments/{collection_comment_id}:
    put:
      tags:
        - Collections
      summary: Update a collection comment
      description: |
        Edits a comment's text. Only the comment's author may edit it; an unknown
        comment or one the authenticated user didn't write returns 404.
      operationId: updateCollectionComment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: collection_comment_id
          required: true
