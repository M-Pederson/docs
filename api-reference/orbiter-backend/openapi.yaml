        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        is_personal:
          type: boolean
          description: Always false for organizations created via this endpoint.
        workos_organization_id:
          type:
            - string
            - 'null'
          description: Null when the WorkOS mirror has not completed yet.
        company_id:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            Company auto-linked by domain match at creation;
            null when no company claims the domain.
        domains:
          type: array
          items:
            type: string
          description: Flat claimed-domain names; see organization_domains.
        organization_domains:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationDomain'
          description: Claimed domains with ownership-verification state.
        activated:
          type: boolean
          description: |
            Whether the org may be selected and used. Personal orgs are
            always activated; a team org activates when its first claimed
            domain verifies. Until then it is absent from the sign-in org
            picker and cannot mint an org-scoped session.
        activated_at:
          type:
