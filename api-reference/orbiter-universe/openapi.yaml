        - error
        - meta
    GetAddPersonRequest:
      type: object
      description: |
        The #13039 seed contract. Legacy integer fields (user_id, source_entity_id) and Xano's data_source environment selector are accepted for caller compatibility and ignored.
      properties:
        full_name:
          type: string
          description: |
            Split deterministically into first/middle/last. A provider-supplied name wins over this one.
        email:
          type: array
          items:
            type: string
          description: |
            Lowercased and deduped. Drives the identity ladder; a non-role-local address is a strong key for a person.
        links:
          type: array
          items:
            type: string
          description: |
            Profile and contact URLs. The first linkedin.com/in link becomes the identity candidate; the rest are stored as links.
        phone_numbers:
          type: array
          items:
            type: string
          description: |
            Normalized to E.164. A number with no + and no phone_region is stored but never becomes an identifier — a guessed country code would fuse two unrelated people.
        company_name:
          type: string
          description: Employer hint; read by the orchestrator, not the gate.
        title:
          type: string
          description: Role hint; read by the orchestrator, not the gate.
        user_id:
          type: integer
          description: Legacy; accepted and ignored.
        source:
          type: string
          description: |
            Business attribution recorded on contact rows (e.g. "User Input", "Hubspot"). Provider-discovered rows carry the provider's own name instead.
        data_source:
          type: string
          description: |
            Legacy Xano environment selector (live/staging/sandbox); accepted and ignored — each environment has its own database.
        phone_region:
          type: string
          description: |
            ISO 3166-1 alpha-2 hint (e.g. "GB") that lets a local-format number become an identifier. Not part of the Xano contract.
        queue:
          type: boolean
          description: Forces the queue path instead of async dispatch.
        deep_research:
          type: boolean
          description: |
            Requests the agentic bio tier; OR-promoted on the queue row, so it is never cleared by a later request that omits it.
        cascade_depth:
          type: integer
          description: |
            0 = seed (providers run, async dispatch); >0 = leaf (no provider spend, queued) so one seed cannot start a wave.
        priority_tier:
          type:
            - integer
            - 'null'
          description: |
            Passed through as given — an explicit 0 SURVIVES here, unlike Xano, which coerced it to 4 and made the row undrainable.
        is_c_suite:
          type: boolean
          description: Marks a company-seeded executive; read downstream.
        hold_downstream:
          type: boolean
          description: Suppresses both dispatch and queueing.
        orbiter_verified:
          type: boolean
          description: |
            Accepted; not yet applied to the stored emails (the email writer has no verified flag today).
        source_function:
          type: string
        source_entity_id:
          type: integer
          description: Legacy; accepted and ignored.
        source_entity_uuid:
          type:
            - string
            - 'null'
          format: uuid
          description: Discovery provenance, persisted to the queue row.
        source_entity_type:
          type: string
        force:
          type: boolean
          description: |
            Re-runs providers past the debounce on the dispatched run; never rides a queue row.
    PersonShell:
      type: object
      description: |
        Returned populated on found/created branches, null-fielded on misses. person_created is true only on a fresh create.
      properties:
        person_created:
          type: boolean
        master_person_id:
          type:
            - string
            - 'null'
          format: uuid
          description: The Universe entity UUID (canonical id).
        node_uuid:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            Graph node uuid; populated on creates unless the graph was unavailable (backfilled later).
        full_name:
          type:
            - string
            - 'null'
          description: |
            A temp_-prefixed value means no source produced a name yet; it is repaired later and must not be displayed.
        linkedin_url:
          type:
            - string
            - 'null'
          description: |
            Identity-grade only — an unverified research candidate is never returned here.
        match_via:
          type:
            - string
            - 'null'
          description: |
            Which key resolved an existing person (linkedin, email, phone, pdl, fundable); null on a create.
        fiber_deferred:
          type: boolean
          description: |
            Identity is still resolving in a background run. Enrichment has not been dispatched yet and fires when the run settles.
      required:
        - person_created
        - master_person_id
        - node_uuid
        - full_name
        - linkedin_url
        - match_via
        - fiber_deferred
    PersonShellEnvelope:
      type: object
      properties:
