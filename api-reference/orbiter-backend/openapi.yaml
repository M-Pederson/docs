                    type: array
                    items:
                      $ref: '#/components/schemas/Company'
                  error:
                    type:
                      - object
                      - 'null'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                      total:
                        type: integer
                      next_cursor:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createCompany
      tags:
        - Companies
      summary: Create a company
      description: |
        Resolve a company from its website or LinkedIn/Crunchbase company page and add it to the authenticated user's contacts. A company we do not already hold is created through the enrichment provider and written here under the id it assigns. Idempotent: repeating the call returns the same company with company_created and contact_added false.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreateRequest'
      responses:
        '200':
          description: Company already existed; contact ensured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyCreateEnvelope'
        '201':
          description: Company created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyCreateEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /companies/url-lookup:
    post:
      operationId: lookupCompany
      tags:
        - Companies
      summary: Look up a company by unique signal
      description: |
        Resolve a company from any provided unique signal (LinkedIn URL, domain, email, or phone). At least one is required; the first match wins (no priority order). On a miss, third-party enrichment is requested and the response is pending_enrichment.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyLookupRequest'
      responses:
        '200':
          description: Lookup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CompanyLookup'
                  error:
                    type:
                      - object
                      - 'null'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /companies/{company_id}:
    get:
      operationId: getCompany
      tags:
        - Companies
      summary: Get one company
      description: Get a company's full detail record
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Company detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CompanyDetail'
                  error:
                    type:
                      - object
                      - 'null'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /company-financials:
    get:
      operationId: getCompanyFinancials
      tags:
        - Companies
      summary: Get a company's financial data and funding rounds
      description: |
        Powers the company sheet's Financials tab. Returns the company's
        financial record plus every funding round with its investors and, for
        institutional investors, the named partners at the investing firm.

        `financial_data` is null until the company has a financial record;
        `funding` is always an array. Monetary amounts inside `money_raised` are
        denominated in **millions** (1 = $1M, 0.5 = $500K). Note that
        `funding_total_value` / `funding_total_value_usd` on `financial_data` are
        in **whole units**, not millions — the two scales differ.
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: query
          required: true
          description: The company whose financials to return.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The company's financial data and funding rounds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyFinancialsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /company-contacts:
    get:
      operationId: listCompanyContacts
      tags:
        - Company Contacts
      summary: Get all company contacts
      description: List the authenticated user's saved companies (company contacts)
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: cursor
          in: query
          schema:
            type: string
        - name: query
          in: query
          description: Case-insensitive company-name filter.
          schema:
            type: string
        - name: sort
          in: query
          description: Sort order. `created_at` is newest-first; `name` is company name A-Z.
          schema:
            type: string
            enum:
              - created_at
              - name
            default: created_at
        - name: created_after
          in: query
          description: Only company contacts created at or after this RFC3339 timestamp (inclusive).
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          description: Only company contacts created at or before this RFC3339 timestamp (inclusive).
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated company-contact list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompanyContactListItem'
                  error:
                    type:
                      - object
                      - 'null'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                      total:
                        type: integer
                      next_cursor:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: addCompanyContact
      tags:
        - Company Contacts
      summary: Add a company to contacts
      description: |
        Creates the caller's company contact and copies the company's public detail records (emails, links, addresses, phones) into the contact join tables. Idempotent: re-adding returns 200 with contact_added=false.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyAddContactRequest'
      responses:
        '200':
          description: Company contact already existed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CompanyAddContact'
                  error:
                    type:
                      - object
                      - 'null'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
        '201':
          description: Company contact created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CompanyAddContact'
                  error:
                    type:
                      - object
                      - 'null'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /company-contacts/clone:
    post:
      operationId: cloneCompanyContacts
      tags:
        - Company Contacts
      summary: Clone company contacts from a donor
      description: |
        Duplicates the company-contact rows of a randomly chosen donor (the user holding the most company contacts, ties broken randomly) into the authenticated user's account. Only the company_contacts rows are cloned; existing contacts are left untouched and donor data is not deleted. Idempotent — companies the authenticated user already holds are skipped.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Company contacts cloned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CloneCompanyContactsResult'
                  error:
                    type:
                      - object
                      - 'null'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /merge-suspects:
    get:
      operationId: listMergeSuspects
      tags:
        - MergeSuspects
      summary: Get all merge suspects
      description: List the authenticated user's active merge suspect pairs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of suspected duplicate contact pairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MergeSuspect'
                  error:
                    type:
                      - object
                      - 'null'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /merge-suspects/backfill:
    post:
      operationId: backfillMergeSuspects
      tags:
        - MergeSuspects
      summary: Backfill merge-suspect vectors
      description: |
        Enqueue a one-shot pass that vectorizes the authenticated user's
        contacts and runs duplicate detection. Async; returns 202.
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Backfill enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /merge-suspects/{id}/dismiss:
    post:
      operationId: dismissMergeSuspect
      tags:
        - MergeSuspects
      summary: Dismiss a merge suspect
      description: Mark a suspect pair do-not-merge so detection never resurfaces it.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Suspect dismissed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: WorkOS access token returned by /sign-in or /verify-email.
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: |
        Operator shared secret (ADMIN_API_TOKEN) for the admin routes. These
        rewrite identity plumbing for an arbitrary user id, so they are not
        reachable with an end-user bearer token. Unset in an environment →
        the routes return 401.
  schemas:
    Meta:
      type: object
      properties:
        requestId:
          type: string
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    ErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
        issue:
          type: string
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine code — NOT_FOUND / VALIDATION_FAILED / CONFLICT / UNAUTHORIZED / FORBIDDEN / INTERNAL.
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        debug:
          type:
            - string
            - 'null'
          description: Wrapped technical cause; present only in debug mode.
    ErrorEnvelope:
      type: object
      required:
        - data
        - error
        - meta
      description: Error response — data is always null.
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ApiError'
        meta:
          $ref: '#/components/schemas/Meta'
    EmptyEnvelope:
      type: object
      required:
        - data
        - error
        - meta
      description: Success with no payload (e.g. deletes) — data and error are null.
      properties:
        data:
          type: 'null'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
    CompanyRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_name:
          type: string
        logo:
          type:
            - string
            - 'null'
    LocationRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        formatted_location:
          type:
            - string
            - 'null'
    ConnectionRequest:
      type: object
      description: |
        A connection request. Where this is embedded on a person, only live and
        blocked requests are returned: a plain decline (or a clear) drops the
        object to null so the client can offer connect again. `from_blocked`
        true means the request is dead for good — hide the connect action.
      properties:
        id:
          type: string
          format: uuid
        user_from_id:
          type:
            - string
            - 'null'
          format: uuid
        user_to_id:
          type:
            - string
            - 'null'
          format: uuid
        request_message:
          type:
            - string
            - 'null'
        declined:
          type: boolean
        from_blocked:
          type: boolean
        connected_at:
          type:
            - string
            - 'null'
          format: date-time
        accept_message:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Connection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        user_connected_to_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    EmailActivity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        user_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        subject:
          type:
            - string
            - 'null'
        grant_id:
          type: string
        thread_id:
          type:
            - string
            - 'null'
        message_id:
          type:
            - string
            - 'null'
        snippet:
          type:
            - string
            - 'null'
        unread:
          type: boolean
        clean_message:
          type:
            - string
            - 'null'
    CalendarEventActivity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        user_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        subject:
          type:
            - string
            - 'null'
        activity_timestamp:
          type:
            - string
            - 'null'
          format: date-time
        grant_id:
          type: string
        event_id:
          type: string
          format: uuid
        status:
          type: string
    SignUpRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 128
        first_name:
          type:
            - string
            - 'null'
          maxLength: 128
        last_name:
          type:
            - string
            - 'null'
          maxLength: 128
        timezone:
          type:
            - string
            - 'null'
          maxLength: 64
          description: IANA timezone, e.g. "America/New_York".
    UserResponse:
      type: object
      required:
        - id
        - active_account
        - copilot_enabled
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type:
            - string
            - 'null'
          format: uuid
        username:
          type:
            - string
            - 'null'
        workos_id:
          type:
            - string
            - 'null'
        graph_id:
          type:
            - string
            - 'null'
        primary_timezone:
          type:
            - string
            - 'null'
        active_account:
          type: boolean
        copilot_enabled:
          type: boolean
        last_activity:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuthTokensResponse:
      type: object
      required:
        - user
        - access_token
        - refresh_token
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        access_token:
          type: string
          description: 'Send as Authorization: Bearer on subsequent requests.'
        refresh_token:
          type: string
    SignUpResponse:
      type: object
      required:
        - user
        - email_verification_required
        - pending_authentication_token
        - email_verification_id
        - tokens
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        email_verification_required:
          type: boolean
          description: When true, post pending_authentication_token + the emailed code to /verify-email.
        pending_authentication_token:
          type: string
          description: Token for /verify-email. Empty when verification is not required.
        email_verification_id:
          type: string
        tokens:
          oneOf:
            - $ref: '#/components/schemas/AuthTokensResponse'
            - type: 'null'
          description: Set (and the user logged in) only when verification was not required; null otherwise.
    SignUpResponseEnvelope:
      type: object
      required:
        - data
        - error
        - meta
      properties:
        data:
          $ref: '#/components/schemas/SignUpResponse'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
    SignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          maxLength: 128
        timezone:
          type:
            - string
            - 'null'
          maxLength: 64
    AuthTokensResponseEnvelope:
      type: object
      required:
        - data
        - error
        - meta
      properties:
        data:
          $ref: '#/components/schemas/AuthTokensResponse'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
    EmailVerificationRequiredResponse:
      type: object
      required:
        - error
        - message
        - pending_authentication_token
      properties:
        error:
          type: string
          example: email_verification_required
        message:
          type: string
        pending_authentication_token:
          type: string
        email_verification_id:
          type: string
    EmailVerificationRequiredResponseEnvelope:
      type: object
      required:
        - data
        - error
        - meta
      properties:
        data:
          $ref: '#/components/schemas/EmailVerificationRequiredResponse'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
    OrganizationOptionResponse:
