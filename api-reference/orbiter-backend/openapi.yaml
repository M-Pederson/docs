  /collection-reactions:
    post:
      tags:
        - Collections
      summary: React to a comment
      description: |
        Sets the authenticated user's reaction on a comment to an emoji. One reaction per
        user per comment — re-reacting replaces the emoji (the row is kept). The
        authenticated user must have access to the comment's collection.
      operationId: createCommentReaction
