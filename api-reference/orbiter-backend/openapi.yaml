        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /collection-reactions/{collection_reaction_id}:
    delete:
      tags:
        - Collections
      summary: Remove a reaction
      description: |
        Deletes one of the authenticated user's reactions by id. Only the owner may delete
        it; an unknown reaction or one the authenticated user didn't make returns 404.
      operationId: deleteCommentReaction
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: collection_reaction_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
