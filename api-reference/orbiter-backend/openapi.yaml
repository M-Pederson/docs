    post:
      tags:
        - Imports
      summary: Register a contact import
      description: |
        Creates the import job and starts asynchronous processing.
        File sources (linkedin_csv, vcard) POST multipart/form-data with an
        `input_source` field and a `file` part, streamed straight into
        storage. The nylas source POSTs JSON with nylas_grant_id — one of
        the caller's connected email accounts — and the worker syncs the
        grant's full address book (looping the Nylas next_cursor).
      operationId: registerContactImport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterImportRequest'
          multipart/form-data:
            schema:
              type: object
              required:
                - input_source
                - file
              properties:
                input_source:
                  type: string
                  description: 'File source format: linkedin_csv or vcard. Must precede the file part.'
                file:
                  type: string
                  format: binary
                  description: The raw export file.
      responses:
        '201':
          description: Created import job (status pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactImportEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
