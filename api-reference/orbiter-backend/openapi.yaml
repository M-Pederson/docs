      tags:
        - Imports
      summary: List the caller's contact imports
      operationId: listContactImports
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor from next_cursor.
      responses:
        '200':
          description: One page of import jobs, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListImportsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
