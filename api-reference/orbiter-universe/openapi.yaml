            type: string
          description: |
            Every known alias. A consumer storing a single alias takes the first — Universe does not drop the rest at the boundary.
        legal_name:
          type:
            - string
            - 'null'
        logo:
          type:
            - string
            - 'null'
        domain:
          type:
            - string
            - 'null'
        alternative_domains:
          type: array
          items:
            type: string
        linkedin_url:
          type:
            - string
            - 'null'
        tagline:
          type:
            - string
            - 'null'
        long_description:
          type:
            - string
            - 'null'
          description: The long-form about text.
        short_description:
          type:
            - string
            - 'null'
          description: The clamped short about text.
        social_insights:
          type: array
          items:
            type: string
