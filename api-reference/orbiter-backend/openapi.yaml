          items:
            $ref: '#/components/schemas/OrganizationOptionResponse'
    OrganizationSelectionRequiredResponseEnvelope:
      type: object
      required:
        - data
        - error
        - meta
      properties:
        data:
          $ref: '#/components/schemas/OrganizationSelectionRequiredResponse'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
    RefreshRequest:
      type: object
      required:
