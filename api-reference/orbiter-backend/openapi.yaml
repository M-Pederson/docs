  /files:
    get:
      tags:
        - Files
      summary: Retrieve the caller's files by filter
      description: |
        One endpoint for every retrieval. Filters combine, and the response shape
        depends on which are present:

        - `q` — text search. Without `semantic`, matches `file_name` /
          `display_name` with a case-insensitive substring match; costs no
          embedding call, so it is safe for type-ahead. With `semantic=true` the
          query is embedded and files are ranked by how close their nearest chunk
          sits to it. Returns one row PER FILE either way, so a document with
          many matching passages does not crowd out the rest. Ranked, so no
          cursor is returned.
        - `ids` — batch read of specific files, for polling upload progress in
          one request instead of one per file. Ids the caller cannot see are
          omitted rather than erroring.
        - `contact_id` / `company_contact_id` — that one contact's files.
        - `scope` — `mine` (the caller's uploads), `contacts` (every file across
          all the caller's contacts), or `all` (default, both). Ignored when a
          contact is pinned.

        Every variant is scoped to the caller: files they own, or files linked to
        a contact they own. Soft-deleted files are never returned.
      operationId: listUserFiles
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search text. Matched against file names unless `semantic=true`.
        - in: query
          name: semantic
          schema:
            type: boolean
            default: false
          description: |
            Rank by meaning instead of matching names. Costs a live embedding
            call, so it is opt-in rather than the default.
        - in: query
          name: ids
          schema:
            type: string
          description: Comma-separated file ids. Use for upload-progress polling.
        - in: query
          name: scope
          schema:
            type: string
            default: all
          description: One of `mine`, `contacts`, `all`. Ignored when a contact is pinned.
        - in: query
          name: contact_id
          schema:
            type: string
            format: uuid
        - in: query
          name: company_contact_id
          schema:
            type: string
            format: uuid
        - in: query
          name: classification
          schema:
            type: string
          description: Narrow to one LLM-assigned file type, e.g. `pitch_deck`.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: cursor
          schema:
            type: string
          description: Opaque cursor from a prior page. Not used by `q` or `ids`.
      responses:
        '200':
          description: |
            A page of files, or ranked search hits when `q` is present.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ListFilesResponseEnvelope'
                  - $ref: '#/components/schemas/SearchFilesEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /files/upload:
    post:
      tags:
        - Files
      summary: Upload one or many files
      description: |
        Stores each file in GCS, records its row, and publishes `files.uploaded`
        per file, so every uploaded file independently runs the whole pipeline
        (extract → classify → chunk → embed). Returns immediately with
        `status=pending` for each; poll `GET /v1/files?ids=…` for progress.

        IMPORTANT — part ordering: send every text field BEFORE the file parts.
        Each file streams straight to GCS as it is reached, so `contact_id` and
        `company_contact_id` must already be known and verified by then.

        Byte-transfer progress is a client-side concern (`XMLHttpRequest.upload.
        onprogress`); the server cannot report it sooner than the client knows it.

        This route does not accept pre-extracted markdown — it is asynchronous
        and the worker extracts every file. Use the deprecated
        `/ingestion/files/upload-file-markdown` if you must supply markdown.

        Files are independent: one failure neither fails the request nor undoes
        its siblings. `201` when all succeeded, `207` when some failed (per-file
        `error` in the array), and an error envelope only when none succeeded.
        Max body size 100 MB across all files.
      operationId: uploadFiles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFilesRequest'
      responses:
        '201':
          description: Every file was stored and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFilesEnvelope'
        '207':
          description: |
            Some files were stored and queued; others failed. Inspect each
            element's `error`. `meta.uploaded` / `meta.failed` carry the counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFilesEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: A supplied contact_id / company_contact_id is not the caller's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/Internal'
  /files/{id}:
    get:
      tags:
        - Files
      summary: Get one of the caller's files
      description: |
        Returns a file the caller owns or that is linked to one of their
        contacts; anything else is a 404 rather than a 403, so the endpoint
        reveals nothing about other users' files.

        `include_markdown` is opt-in because markdown is the whole extracted
        document and routinely megabytes.
      operationId: getUserFile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: include_markdown
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The file, with markdown when requested.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FileResponseEnvelope'
                  - $ref: '#/components/schemas/UploadFileResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags:
        - Files
      summary: Delete one of the caller's files
      description: |
        Soft delete. The row, its GCS blob, and its embeddings all survive, so
        the file stays restorable and a restore costs no re-extraction. The
        deletion timestamp is cascaded onto the file's contact links in the same
        transaction, so the file disappears from every contact listing at once.

        Returns 200 with a null payload, per the house convention that deletes
        are not 204.
      operationId: deleteUserFile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: File soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /files/{id}/preview:
    get:
      tags:
        - Files
      summary: Get a link to the file's preview image
      description: |
        Returns a short-lived signed URL for the file's preview image — a
        downscaled render of page one, produced when the file was processed.
        Available for PDFs and image uploads; other formats have no preview
        yet and return 404.

        The link is returned instead of the image bytes so the client fetches
        the object straight from storage. Files whose preview has not been
        produced (text formats, or anything uploaded before previews existed)
        return 404. `expires_at` is null when the preview is hosted elsewhere
        and we did not sign it.
      operationId: getUserFilePreview
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A link to the preview image.
          content:
