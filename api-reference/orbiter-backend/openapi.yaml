        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /orbiter-connect-requests:
    get:
      tags:
        - Connections
      summary: List pending connection requests
      description: |
        Returns every unresolved connection request the authenticated user is
        on either side of, newest first. A request is unresolved when it has
        not been accepted, declined, or cleared.

        Both directions come back in one list — split them on
        `user_from_id`: equal to the authenticated user's id means the request
        was sent by them, otherwise it was received. Unpaginated; pending
        requests are inherently bounded. `meta.total` carries the count.
      operationId: listOrbiterConnectRequests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user's pending requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListConnectRequestsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags:
        - Connections
      summary: Ask another user to connect
      description: |
        Creates a pending connection request from the authenticated user to
        `user_id` and returns `status: "pending"` (201).

        If `user_id` already has a pending request out to the authenticated
        user, the two are connected immediately instead: that request is
        accepted, both join rows are written, and the response is
        `status: "connected"` (200).

        A request the recipient previously declined — or that either side
        cleared — is revived by asking again, so the client may offer connect
        again after a rejection. A request the recipient *blocked* is not
        revivable and 403s.

        The requester always comes from the session, never the body.
      operationId: sendOrbiterConnectRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendConnectRequest'
      responses:
        '200':
          description: The two users were connected immediately (reciprocal request existed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendConnectRequestEnvelope'
        '201':
          description: A pending request was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendConnectRequestEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            This user blocked the authenticated user; the request cannot be sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Already connected, or a live request to this user already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/Internal'
  /orbiter-connect-requests/{orbiter_connect_request_id}:
    put:
      tags:
        - Connections
      summary: Respond to a connection request
      description: |
        Applies one action to a pending request. Exactly one of `accepted`,
        `declined`, `blocked`, `cleared` must be true — several or none is a
        400.

        `accepted` stamps the request and writes both connection join rows in
        one transaction, then puts each user in the other's contacts and
        notifies the original requester. `declined` marks it declined;
        `blocked` additionally sets `from_blocked`. `cleared` dismisses the
        request from the pending list without accepting or declining.

        Accept, decline, and block are the recipient's alone (403 otherwise);
        either party may clear. An already-accepted request 409s. A request
        the authenticated user is not party to 404s.
      operationId: updateOrbiterConnectRequest
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orbiter_connect_request_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectRequest'
      responses:
        '200':
          description: The updated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectRequestEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only the recipient may accept, decline, or block.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request was already accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/Internal'
  /orbiter-connections:
    get:
      tags:
        - Connections
      summary: List established connections
      description: |
        Returns the authenticated user's established Orbiter connections,
        newest first, each with the connected-to person's card. Unpaginated;
        `meta.total` carries the count.
      operationId: listOrbiterConnections
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user's connections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListConnectionsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /orbiter-connections/{orbiter_connection_join_id}:
    delete:
      tags:
        - Connections
      summary: Remove a connection
      description: |
        Disconnects the pair. The path id is the authenticated user's own join
        row; someone else's row 404s. Both directions are removed, along with
        the spent request rows so the pair can connect again later.
      operationId: deleteOrbiterConnection
      security:
        - bearerAuth: []
