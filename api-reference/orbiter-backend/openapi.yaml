            - string
            - 'null'
        company_name:
          type:
            - string
            - 'null'
    UserSearchResponse:
      type: object
      required:
        - id
        - person_id
        - created_at
        - updated_at
        - person
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        username:
          type:
            - string
            - 'null'
        workos_id:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        person:
          $ref: '#/components/schemas/UserSearchPerson'
    SearchUsersResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSearchResponse'
    SearchUsersResponseEnvelope:
      type: object
      required:
        - data
        - error
        - meta
      properties:
        data:
          $ref: '#/components/schemas/SearchUsersResponse'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
    MePersonResponse:
      type: object
      required:
        - id
        - full_name
        - first_name
        - last_name
        - avatar
        - current_title
        - bio
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        first_name:
          type:
