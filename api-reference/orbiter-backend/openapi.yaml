  /collection-contains:
    get:
      tags:
        - Collections
      summary: Get collections containing an entity
      description: |
        Returns the authenticated user's own collections that pin a given person or company,
        each with its total node count and the id of the node that links the
        entity. Provide exactly one of person_id / company_id.
        Owner-scoped — shared collections are not included.
      operationId: listCollectionsContaining
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: person_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: company_id
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The authenticated user's collections that contain the entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCollectionsContainingResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /collection-comments:
    get:
      tags:
        - Collections
      summary: Get all collection comments
      description: |
        Returns a collection's comments, newest first, each enriched with its
        author (person name + avatar) and the reactions on it. The authenticated user
        must have access to the collection.
      operationId: listCollectionComments
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: collection_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The collection's comments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCollectionCommentsResponseEnvelope'
        '400':
