          type:
            - string
            - 'null'
          description: The nearest matching chunk's text.
        distance:
          type:
            - number
            - 'null'
          description: Cosine distance of the nearest chunk; smaller is closer.
    SearchFilesResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileMatch'
    SearchFilesEnvelope:
      type: object
      required:
        - data
        - error
        - meta
      properties:
        data:
          $ref: '#/components/schemas/SearchFilesResponse'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
    UploadFilesRequest:
      type: object
      required:
        - file
      description: |
        Multi-file upload body. Send all text fields FIRST, then one `file` part
        per file. No markdown field: the worker extracts every file.
      properties:
        file_source:
          type: string
          maxLength: 255
          description: Free-form source label. Defaults to `user-upload`.
        contact_id:
          type: string
          format: uuid
          description: |
            Attach every file in this request to this contact. Must be one of the
            caller's own contacts, else 404. May be combined with
            `company_contact_id`: a deck can belong to a person and their company.
        company_contact_id:
          type: string
          format: uuid
          description: Attach every file to this company contact. Must be the caller's.
        file:
          type: array
          items:
            type: string
            format: binary
          description: |
            One or more file parts, each named `file`. Send them LAST, after
            every text field.
    UploadedFile:
      type: object
      required:
        - name
      description: |
        One element of an upload result. Either the success fields or `error` is
        populated, never both.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The file's name; the rename if one exists, else the uploaded name.
        path:
          type: string
          description: Public GCS URL of the stored object.
        status:
          type: string
          description: Always `pending` here; the pipeline runs asynchronously.
        error:
          type:
            - object
            - 'null'
          description: Present only for a file that failed.
          properties:
            code:
              type: string
            message:
              type: string
    UploadFilesEnvelope:
      type: object
      required:
        - data
        - error
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UploadedFile'
        error:
          type: 'null'
        meta:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                uploaded:
                  type: integer
                failed:
                  type: integer
    FileResponseEnvelope:
      type: object
      required:
        - data
        - error
        - meta
      properties:
        data:
          $ref: '#/components/schemas/FileResponse'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
    UploadFileResponse:
      description: |
        FileResponse plus the document markdown — extracted synchronously by
        the raw endpoint, or echoed from the supplied value by the markdown
        endpoint. List/get responses omit markdown to stay lean.
      allOf:
        - $ref: '#/components/schemas/FileResponse'
        - type: object
