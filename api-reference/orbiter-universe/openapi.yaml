openapi: 3.1.0
info:
  title: Orbiter Universe API
  version: 0.1.0
  description: |
    The consumer-facing contract of the Orbiter Universe backend. Every caller is a registered client (the Orbiter App backend, self-hosted App backends, tooling) authenticating with an API key. Every response carries the canonical entity id — a merged id resolves through the merge chain and the response echoes the requested id.
servers:
  - url: https://universe.orbiter.io
security:
  - bearerAuth: []
tags:
  - name: Entities
    description: Canonical entity reads and identifier resolution.
  - name: Enrichment
    description: |
      Data-plane enrichment triggers: the company get-or-create entry gate (scope enrich:company) and the person one (enrich:person). The two scopes are independent.
  - name: Projections
    description: |
      Versioned packages consumers read and upsert from. Row-derived projections carry an entity's attributes; the graph-derived subgraph projection carries its relationships, including edge types that have no backing row.
  - name: Graph
    description: |
      Operator-only graph seeding (scope graph:seed). Not part of the consumer contract — self-hosted clients never call these.
  - name: Admin
    description: |
      Management plane: client registry and API-key lifecycle (scope clients:manage). Not part of the consumer contract — self-hosted clients never call these.
  - name: Agents
    description: |
      Management plane for the agentic enrichment tier: re-drive stalled Deep Bio jobs, or research one person again on purpose. Staff-only (WorkOS role admin, no scope grants them) because each call can spend provider credit. Not part of the consumer contract — an agent's output leaves through the publish projections like any other fact.
paths:
  /v1/entities/{id}:
    get:
      operationId: getEntity
      tags:
        - Entities
      summary: Get the canonical entity for an id
      description: |
        Resolves the id through the merge chain (merged_into) and returns the living canonical row. The response id may differ from the requested id — consumers must overwrite stored references with the returned id. Requires scope `read:entity`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The canonical entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/entities/{id}/projection:
    get:
      operationId: getEntityProjection
      tags:
        - Projections
      summary: Get the versioned projection for a company or person
      description: |
        Returns `company_projection.v1` or `person_projection.v1` depending on the entity type — the versioned envelope consumers apply idempotently to their own storage. Check `schema_version` to tell them apart. The id resolves through the merge chain first; the `universe_*_uuid` in the body is always the canonical id, and it is also the graph node id. `run_id` is deterministic per (entity, source state): re-pulling unchanged data yields the same run_id, so consumer re-applies are natural no-ops. Returns 404 until a company has been distilled, and — for a person — until enrichment has completed SUCCESSFULLY: a person whose run is still pending or settled-failed is deliberately not emitted. Requires scope `projections:pull`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The projection package.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CompanyProjectionEnvelope'
                  - $ref: '#/components/schemas/PersonProjectionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/entities/{id}/subgraph:
    get:
      operationId: getEntitySubgraph
      tags:
        - Projections
      summary: Get an entity and its directly connected neighbours from the graph
      description: |
        Returns the entity plus everything one hop away, as nodes and edges copied verbatim from the graph, for a consumer to write into its own graph unchanged.
        This projection is derived from the graph, not from Postgres rows. The row-derived projections carry only what has rows; several edge types have none, FOUNDED among them, so a consumer that rebuilds relationships from those loses them with no error.
        Geography, expertise and tombstoned nodes are excluded, and a node reached by several edges is returned once. Exclusions are policy, not a caller option: they depend on the ontology, and two consumers copying one entity must get the same graph.
        Only edges incident to the anchor are returned. An edge between two neighbours belongs to their own neighbourhoods.
        Node and edge properties are returned verbatim and are deliberately untyped: the same key carries different types across labels, so updated_at is a string on Person and an integer on Company.
        Embeddings are returned as arrays of numbers. A consumer must re-wrap them as vectors on write, or its vector index will not see them and search will silently return nothing.
        404 until the entity's first node write has landed. Write the nodes before the edges. An edge write matches its two endpoints, so running it first drops every edge with no error and no warning, leaving a node set that looks complete and has no relationships.
        Requires scope `subgraph:read`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Entity id. Resolved through the merge chain first.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: |
            Maximum neighbours returned. The anchor is always included and does not count toward it.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: include_embeddings
          in: query
          required: false
          description: |
            Vectors dominate the payload at roughly 107KB per node. A consumer that needs structure only should turn them off; one that intends to search must keep them, since they are generated here once and are never regenerated downstream.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: The entity and its one-hop neighbourhood.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubgraphEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/enrichment/companies/get-add:
    post:
      operationId: getAddCompany
      tags:
        - Enrichment
      summary: Get-or-create a company (the enrichment entry gate)
      description: |
        The only sanctioned company get-or-create path. Resolves the seed through strong identifiers (profile URL, domain), runs the pre-create guards and the LLM research preflight, dedups against the Universe backbone and the fundable mirror, and creates the company with its initial graph node when nothing matches. Every branch returns the shell: guard misses come back 200 with `company_created: false` and null fields — a blocked input is an answer, not an error. A company name alone is never enough: the seed must carry a domain or profile URL. Requires scope `enrich:company`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAddCompanyRequest'
      responses:
        '200':
          description: The company shell (found, created, or typed miss).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyShellEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/enrichment/persons/get-add:
    post:
      operationId: getAddPerson
      tags:
        - Enrichment
      summary: Get-or-create a person (the enrichment entry gate)
      description: |
        The only sanctioned person get-or-create path. Resolves the seed through its identifiers, dedups BEFORE paying for any provider, then runs the identity ladder (People Data Labs → Enrich Layer → Exa) only when nothing matched, and creates the person with an initial graph node. Every branch returns the shell: guard misses come back 200 with `person_created: false` and null fields — a blocked input is an answer, not an error. Requires scope `enrich:person`, which is independent of `enrich:company`. Two response fields need reading before you integrate. `match_via` names the key that resolved an existing person, so a caller can tell a LinkedIn hit from an email one. `fiber_deferred` means identity is still settling in a background run: the person row and node exist, enrichment has NOT been dispatched yet, and it fires automatically once the run lands — so poll the entity rather than re-posting the seed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAddPersonRequest'
      responses:
        '200':
          description: The person shell (found, created, or typed miss).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonShellEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/enrichment/companies/{id}/social-insights:
    post:
      operationId: companySocialInsights
      tags:
        - Enrichment
      summary: Generate on-demand social insights for a company
      description: |
        Runs the social-insights synthesis (Grok over six bounded web evidence results) for one company — an on-demand context tool for meeting prep and suggestion flows, deliberately NOT part of the enrichment pipeline. Requires scope `social_media_insights:company`. Results are cached for 5 days: a repeat call inside the window returns the stored insights with `cached: true` and costs no LLM run (pass `force: true` to rebuild anyway). Companies with no distilled about text return `skipped: true` — enrich first.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Bypass the 5-day cache and rebuild.
      responses:
        '200':
          description: The insights (fresh, cached, or a typed skip).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialInsightsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/enrichment/persons/{id}/social-insights:
    post:
      operationId: personSocialInsights
      tags:
        - Enrichment
      summary: Generate on-demand social insights for a person
      description: |
        The person twin of the company trigger: a Grok synthesis over six bounded web evidence results, grounded in the person's distilled biography. On-demand context for meeting prep and suggestion flows, deliberately NOT part of the enrichment pipeline. Requires scope `social_media_insights:person` — a client sold company context is not thereby sold context on individuals. Results are cached for 5 days: a repeat call inside the window returns the stored insights with `cached: true` and costs no LLM run (pass `force: true` to rebuild anyway). People with no distilled biography return `skipped: true` — enrich first.
        Returns six outputs. `insights` name a platform and a time anchor; `interests` accumulate across runs rather than being replaced; `profile_urls` carry the evidence that bound them and are the only ones persisted, with everything refused recorded in `held_profile_urls`; `coverage_note` is the only place evidence- coverage commentary appears; `social_media_influence` is null rather than padded when the evidence cannot fill it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Bypass the 5-day cache and rebuild.
      responses:
        '200':
          description: The insights (fresh, cached, or a typed skip).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSocialInsightsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/callbacks/fullenrich:
    post:
      operationId: fullEnrichCallback
      tags:
        - Enrichment
      summary: Receive a finished FullEnrich profile (provider plane)
      description: |
        **Provider plane, not a consumer surface** — FullEnrich POSTs the profile we asked for. There is no API key and no scope: the caller proves itself with `X-Signature-SHA1`, an HMAC of the raw body keyed with the API key we call FullEnrich with. An unconfigured key denies every request. Documented for operators, not for integration: no consumer may call it, and it reads nothing out of the Universe. Delivery is at-least-once and may arrive more than once for one lookup, so the body is taken as evidence before it is judged. Every signed body is answered 200, including one we cannot parse or attribute — a non-2xx makes FullEnrich redeliver, and redelivery is what once wrote one person's profile onto another. A 500 means we failed to keep the payload and genuinely want it again.
      security:
        - providerSignature: []
      requestBody:
        required: true
        description: FullEnrich's webhook body, kept verbatim.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The delivery was taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/backfill/graph/seed/locations:
    post:
      operationId: seedGraphLocations
      tags:
        - Graph
      summary: Run one bounded batch of geography node creation
      description: |
        Operator-only. `kind=country` MERGEs `Country:Entity` nodes; `kind=region` MERGEs `Region:Entity` nodes plus their `IN_COUNTRY` edge; `kind=city` MERGEs `City:Entity` nodes plus `IN_REGION` (or `IN_COUNTRY` for region-less cities). Rows whose parent node is missing are held back (`awaiting_parent`) and picked up on a later run — seed countries, then regions, then cities, re-running each while `has_more` is true. Requires an authenticated admin user (role `admin`); consumer API keys are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - country
                    - region
                    - city
                limit:
                  type: integer
                  description: Rows per batch (default 15, max 100).
              required:
                - kind
      responses:
        '200':
          description: Batch summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/backfill/graph/seed/expertise:
    post:
      operationId: seedGraphExpertise
      tags:
        - Graph
      summary: Run one bounded batch of expertise taxonomy node creation
      description: |
        Operator-only. `kind=domain` creates `DomainExpertise:Entity` nodes; `kind=subdomain` creates `SubDomainExpertise:Entity` nodes plus `HAS_SUBDOMAIN` edges. Subdomains whose parent domain has no node yet are held back (reported as `awaiting_parent`) and picked up on a later run. Seed domains to exhaustion before subdomains. Re-run while `has_more` is true. Requires an authenticated admin user (role `admin`); consumer API keys are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - domain
                    - subdomain
                limit:
                  type: integer
                  description: Rows per batch (default 15, max 100).
              required:
                - kind
      responses:
        '200':
          description: Batch summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/backfill/graph/wipe:
    post:
      operationId: wipeGraph
      tags:
        - Graph
      summary: Wipe enrichment-created graph nodes and/or table rows
      description: |
        Operator-only, DESTRUCTIVE. `target` selects what dies — `nodes` (default): one bounded batch of nodes whose labels are outside the reference keep-set (Country, Region, City, DomainExpertise, SubDomainExpertise) — or, with `entity_type`, only that scope's labels (company = Company + Funding_Round; person = Person + its credential nodes Work, Certification, Honor; film_tv = Film_TV + Film_TV_Award; music = Music_Group, Release_Group, Recording, Music_Work, Event plus the Release and Place support nodes) — plus the write-back ledgers nulled (entities graph_node_uuid / graph_written_at, entity_addresses graph_written_at, funding_rounds graph_node_uuid / raised_edge_uuid) so replay rebuilds them; round caveat: with rows kept, cleared round uuids require a table-side reset before deals reprocess or duplicates land. `tables`: one-transaction delete of enrichment-written ROWS — theses, typed caches, entities and every ON DELETE CASCADE dependent (identifiers, facts, payloads, attempts, queue, satellites, dates, rounds, profiles) — plus fundables.deals.processed_at reset so the fanout re-materializes rounds (mirror data itself untouched); no graph calls. `all`: tables first, then a node batch. Seeded reference rows and nodes always survive. Do not run while enrichment/queue drain is active. Requires `confirm: true`; re-run while `has_more` is true (node batches; table wipes are one-shot). Requires an authenticated admin user (role `admin`); consumer API keys are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: boolean
                  description: Must be true — guards against stray POSTs.
                limit:
                  type: integer
                  description: Nodes per batch (default 1000, max 10000).
                entity_type:
                  type: string
                  description: |
                    Optional scope; omit to wipe every non-reference node. Known scopes: company, person, film_tv, music. `music` is the one umbrella — it covers all five music entity types (music_group, music_release_group, music_recording, music_work, music_event) plus the music_release / music_place support rows and the artist / label satellite profiles, because they are one pipeline.
                target:
                  type: string
                  enum:
                    - nodes
                    - tables
                    - all
                  description: What dies; omitted = nodes.
              required:
                - confirm
      responses:
        '200':
          description: Batch summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WipeResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/falkordb:
    get:
      operationId: listFalkorDBInstances
      tags:
        - Graph
      summary: List graph connection-config rows
      description: |
        Operator-only. Returns every falkordb.falkordb row, newest first. The OLDEST row is the one read at boot to build the graph client. Credentials are included by design. Requires an authenticated admin user (role `admin`); consumer API keys are rejected.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All connection-config rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      operationId: createFalkorDBInstance
      tags:
        - Graph
      summary: Create a graph connection-config row
      description: |
        Operator-only. Inserts a falkordb.falkordb row; the config is read at boot, so it takes effect on the next process start. db_connection or host is required. Requires an authenticated admin user (role `admin`); consumer API keys are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                graph_name:
                  type: string
                user_name:
                  type: string
                password:
                  type: string
                host:
                  type: string
                port:
                  type: string
                db_connection:
                  type: string
                  description: |
                    Full endpoint (redis:// / falkors:// URL or host:port); used verbatim when set.
      responses:
        '201':
          description: The created row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/falkordb/{id}:
    delete:
      operationId: deleteFalkorDBInstance
      tags:
        - Graph
      summary: Delete a graph connection-config row
      description: |
        Operator-only. Removes a falkordb.falkordb row; effective on the next process start. Requires an authenticated admin user (role `admin`); consumer API keys are rejected.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Deleted (data is null).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/clients:
    post:
      operationId: createConsumerClient
      tags:
        - Admin
      summary: Register a consumer client
      description: |
        Management plane, never part of the consumer data contract. Registers a client with its entitlement scopes; issue a key next via `POST /v1/admin/clients/{id}/keys`. Requires an authenticated admin USER (WorkOS session bearer token, role `admin`) — consumer API keys are always rejected here. Until the auth feature lands the verifier is nil and every deployed environment denies all requests.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Unique display name for the client org.
                scopes:
                  type: array
                  items:
                    type: string
                  description: |
                    Entitlement scopes — data plane only (read:entity, read:person, read:company, read:film_tv, projections:pull, subgraph:read, investor_narrative:read, corrections:propose, enrich:company, enrich:person, enrich:film_tv, social_media_insights:company, social_media_insights:person). Unknown scopes are rejected; management actions are role-guarded and have no scope.
                entitlements:
                  type: object
                  description: |
                    Optional entity-level filter for partial-data deals, e.g. {"entity_types": ["person"]}. Empty = full access within scopes.
                contact_email:
                  type:
                    - string
                    - 'null'
              required:
                - name
      responses:
        '201':
          description: The registered client (no key material).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerClientEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A client with this name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/clients/{id}/keys:
    post:
      operationId: issueConsumerClientKey
      tags:
        - Admin
      summary: Issue an API key for a client
      description: |
        Management plane. Mints a raw API key, stores only its SHA-256 hash, and returns the raw key ONCE — it cannot be retrieved again, only revoked and replaced. Multiple active keys per client enable zero-downtime rotation: issue new, deploy, revoke old. Requires an authenticated admin user (role `admin`), never a consumer API key.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type:
                    - string
                    - 'null'
                  description: Ops label, e.g. "initial key 2026-07".
                expires_at:
                  type:
                    - string
                    - 'null'
                  format: date-time
                  description: Optional expiry; must be in the future.
      responses:
        '201':
          description: The issued key, raw secret included this once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedKeyEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/keys/{id}/revoke:
    post:
      operationId: revokeConsumerClientKey
      tags:
        - Admin
      summary: Revoke an API key
      description: |
        Management plane. Soft-revokes one key (the row survives for audit); other keys on the same client keep working. Requires an authenticated admin user (role `admin`), never a consumer API key.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Revoked (data is null).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/agents/deep-bio/sweep:
    post:
      operationId: sweepDeepBioJobs
      tags:
        - Agents
      summary: Re-drive Deep Bio jobs that stopped without settling (management plane)
      description: |
        Picks the research jobs that stalled and asks a worker to run each again. **Management plane, staff only** — a WorkOS session with role `admin`, never a consumer API key. There is no scope that grants this, because a swept job can spend provider credit. Three kinds of row are picked: a `pending` job whose run request was lost, an `error` job whose retry is due, and a `running` job whose lease expired because its worker died. Jobs out of attempts are never picked, so a doomed job stops being swept rather than looping. The case this exists for is a job RELEASED after its envelope landed: it holds a paid, valid payload that nothing else will ever normalize. Sweeping that job usually costs NOTHING, because the runner resumes from the stored envelope instead of re-buying the research. It only REQUESTS runs — it never creates a job, so it cannot spend outside the launch guards (freshness window and daily cap). One bounded batch per call, so an operator watches the counts rather than starting an unbounded drain. A full batch is not a cleared backlog: call again until `picked` is zero.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            Jobs to request in this batch. Omitted uses the server default (5, matching the cron's batch size).
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: |
            What the sweep asked for. `picked` is what the query returned and `requested` is what was published; a gap means the topic refused and those rows stay picked for the next sweep.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepBioSweepEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/agents/deep-bio/persons/{id}/force:
    post:
      operationId: forceDeepBio
      tags:
        - Agents
      summary: Research one person's Deep Bio again (management plane)
      description: |
        Creates a research job even when the person already has a recent successful one, bypassing the freshness window. **Management plane, staff only** — a WorkOS session with role `admin`, never a consumer API key. There is no scope that grants this: one call buys minutes of web research and tens of thousands of output tokens. The daily spend cap STILL APPLIES. Forcing is for re-running one person, never for getting past the ceiling — a refusal by the cap returns 200 with `outcome: skipped` and a null `job_id`, because nothing went wrong, the answer is no. Single-flight still applies too: a person with a live job gets that job's id back rather than a second one. `requested` is false when the job exists but no worker was asked (the run request failed) — the sweep above collects it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The person entity's canonical id.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            The job the request resolved to, and what the guards decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepBioForceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Consumer API key issued by the consumers registry.
    providerSignature:
      type: apiKey
      in: header
      name: X-Signature-SHA1
      description: |
        Provider callback plane. Hex-lowercase HMAC-SHA1 of the raw request body, keyed with the API key we call that provider with — so the provider holds no consumer identity and no second secret exists. Verified against the bytes as sent; a re-serialized body has a different digest.
  schemas:
    Meta:
      type: object
      properties:
        requestId:
          type: string
      required:
        - requestId
    Error:
      type: object
      properties:
        code:
          type: string
          description: Upper-snake error kind (VALIDATION_FAILED, NOT_FOUND, ...).
        message:
          type: string
        details:
          type:
            - array
            - 'null'
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
      required:
        - code
        - message
    ErrorEnvelope:
      type: object
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    EmptyEnvelope:
      type: object
      properties:
        data:
          type: 'null'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    Entity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The canonical (living) entity id. Persist this one.
        requested_id:
          type: string
          format: uuid
          description: The id the caller asked for; differs after a merge.
        entity_type:
          type: string
        display_name:
          type:
            - string
            - 'null'
      required:
        - id
        - requested_id
        - entity_type
        - display_name
    EntityEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Entity'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    ProjectionCompany:
