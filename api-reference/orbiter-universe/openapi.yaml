    WipeResult:
      type: object
      properties:
        remaining_before:
          type: integer
          description: Non-reference nodes in the graph before this batch.
        nodes_deleted:
          type: integer
        edges_deleted:
          type: integer
        entity_links_cleared:
          type: integer
          description: |
            universe.entities rows whose graph_node_uuid / graph_written_at were nulled.
        address_links_cleared:
          type: integer
          description: |
            universe.master_addresses rows whose graph_written_at was nulled (re-queued for the locations drain).
        round_links_cleared:
          type: integer
          description: |
            universe.funding_rounds rows whose graph_node_uuid / raised_edge_uuid were nulled — see the operation's round caveat before re-materializing deals.
        entities_deleted:
          type: integer
          description: |
            universe.entities rows deleted (targets tables/all); cascade victims are not counted separately.
        rows_deleted:
          type: integer
          description: |
            Explicitly-deleted blocker rows (theses, typed caches, dangling relation facts) for targets tables/all.
        deals_reset:
          type: integer
          description: |
            fundables.deals rows whose processed_at write-marker was cleared (targets tables/all).
        has_more:
          type: boolean
          description: True when nodes remain — run another batch.
      required:
        - remaining_before
        - nodes_deleted
        - edges_deleted
        - entity_links_cleared
